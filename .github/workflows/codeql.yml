name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Setiap Senin 03:27 UTC di branch default (main)
    - cron: '27 3 * * 1'
  workflow_dispatch:

# Batalkan run yang sudah usang (superseded) pada push/PR yang sama agar tidak
# menghabiskan runner minutes.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Prinsip least-privilege: cukup security-events: write (upload SARIF ke Code
# Scanning), actions: read + contents: read untuk menjalankan action.
permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: setup — install dependency + typecheck + test SEKALI saja, lalu
  # simpan state (node_modules) sebagai artifact untuk dipakai ulang oleh job
  # analyze. Ini menghindari `npm ci` dijalankan dua kali per run.
  # ---------------------------------------------------------------------------
  setup:
    name: Setup (deps + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Test suite (jest)
        run: npm test

      # Simpan node_modules hasil npm ci untuk di-download ulang oleh job
      # analyze (via needs: setup). Retention 1 hari cukup — seluruh cell matrix
      # analyze berjalan segera setelah setup selesai.
      - name: Upload node_modules for analyze job
        uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: analyze — CodeQL (advanced setup).
  #
  # Matrix "advanced": TIDAK semua cell menjalankan full query packs.
  #   - Cell 1 (full):  menjalankan security-and-quality (default +
  #                     security-extended + maintainability/reliability) dengan
  #                     paths-ignore minimum (node_modules + coverage saja).
  #   - Cell 2 (filter): menjalankan security-extended saja, dengan paths-ignore
  #                     yang lebih agresif (test/**, examples/**, docs/**,
  #                     demo/** ikut dikecualikan) — fokus ke kode produksi.
  #
  # Prefix `+` pada input `queries` membuat query pack di-*append* ke default
  # queries (bukan menggantikan) — pola yang didokumentasikan resmi:
  # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
  # build-mode: none dipakai karena JavaScript/TypeScript adalah bahasa
  # interpretasi — CodeQL cukup mengekstrak source tree tanpa menjalankan build.
  #
  # paths-ignore ditaruh di input `config` (bukan input langsung init) karena
  # github/codeql-action/init@v3 tidak memiliki input `paths-ignore` langsung.
  # Nilai per-cell di-render lewat toJson() dari flow sequence matrix.
  #
  # Quality gate: github/codeql-action/analyze@v3 TIDAK memiliki input `fail-on`
  # (tidak ada di action.yml v3 maupun v4). Untuk memblokir PR saat ada temuan,
  # workflow ini memakai pola advanced: step "Check for CodeQL findings"
  # membaca SARIF hasil analyze dan exit non-zero jika ada temuan dengan level
  # >= ambang (fail-on: error). Dengan begitu check "CodeQL" menjadi required
  # check dan PR tidak bisa di-merge selama masih ada temuan.
  # ---------------------------------------------------------------------------
  analyze:
    name: Analyze (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cell 1 — run penuh: security-and-quality (default + extended +
          # maintainability & reliability), hanya mengecualikan dependency dan
          # artefak coverage.
          - profile: security-and-quality
            queries: '+security-and-quality'
            fail-on: error
            category: '/language:javascript-typescript/full'
            paths-ignore: ['**/node_modules/**', '**/coverage/**']

          # Cell 2 — run terfilter: security-extended (default + lower
          # severity/precision queries) dengan paths-ignore yang lebih agresif
          # agar fokus ke kode produksi src/ + cli/.
          - profile: security-extended
            queries: '+security-extended'
            fail-on: error
            category: '/language:javascript-typescript/extended'
            paths-ignore:
              - '**/node_modules/**'
              - '**/coverage/**'
              - 'test/**'
              - 'examples/**'
              - 'docs/**'
              - 'demo/**'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download node_modules from setup job
        uses: actions/download-artifact@v5
        with:
          name: node_modules
          path: node_modules

      # Tulis file config CodeQL per-cell. Ditulis lewat step shell (bukan
      # YAML-in-YAML di input `config`) supaya paths-ignore flow sequence
      # matrix tidak merusak parsing YAML workflow (error "deficient
      # indentation" di user-config-from-action.yml). File harus berada di
      # DALAM workspace — config-file di luar workspace ditolak CodeQL init
      # ("configuration file ... is outside of the workspace").
      - name: Write CodeQL config file
        shell: bash
        run: |
          CONFIG_PATH="$GITHUB_WORKSPACE/codeql-config-${{ matrix.profile }}.yml"
          {
            echo "name: \"pdf-gate CodeQL config (${{ matrix.profile }})\""
            echo "paths-ignore:"
            for p in ${{ join(matrix.paths-ignore, ' ') }}; do
              echo "  - '$p'"
            done
          } > "$CONFIG_PATH"
          echo "codeql-config-path=$CONFIG_PATH" >> "$GITHUB_ENV"
          cat "$CONFIG_PATH"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: ${{ matrix.queries }}
          config-file: ${{ env.codeql-config-path }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: ${{ matrix.category }}

      # Bersihkan file config sementara dari workspace runner
      - name: Cleanup config file
        if: always()
        shell: bash
        run: rm -f "${{ env.codeql-config-path }}"

      # -----------------------------------------------------------------------
      # Quality gate berbasis SARIF: blokir PR kalau ada temuan di atas ambang
      # (fail-on). SARIF dari analyze@v3 disimpan di ${{ runner.temp }}/results.
      #
      # Catatan: di YAML block scalar, indent umum (10 spasi) dibuang saat
      # parsing, sehingga heredoc 'PY' dan kode Python tampil di kolom 0 pada
      # shell yang dirender. Baris Python memakai indent RELATIF (10/12/14)
      # agar hasil akhirnya tetap Python yang valid.
      # -----------------------------------------------------------------------
      - name: Check for CodeQL findings
        if: always()
        run: |
          echo "::group::Check for CodeQL findings (${{ matrix.profile }})"
          threshold="${{ matrix.fail-on }}"
          failures=0
          # Lokasi SARIF default dari analyze@v3 (input `output`, default
          # "../results" relatif ke $GITHUB_WORKSPACE) = $RUNNER_TEMP/results.
          sarif_dir="${RUNNER_TEMP}/results"
          if [ ! -d "$sarif_dir" ]; then
            echo "::warning::SARIF directory not found: $sarif_dir"
            echo "::endgroup::"
            exit 0
          fi
          for f in "$sarif_dir"/*.sarif; do
            [ -e "$f" ] || continue
            echo "SARIF: $f"
            python3 - "$f" "$threshold" <<'PY'
          import json, sys
          path, threshold = sys.argv[1], sys.argv[2]
          order = {"none": 0, "note": 1, "warning": 2, "error": 3}
          need = order.get(threshold, 3)
          found = []
          with open(path) as fh:
            data = json.load(fh)
          for run in data.get("runs", []):
            for res in run.get("results", []):
              level = res.get("level", "warning")
              if order.get(level, 1) >= need:
                rule = res.get("ruleId", "unknown")
                loc = ""
                for l in res.get("locations", []):
                  phys = l.get("physicalLocation", {})
                  art = phys.get("artifactLocation", {})
                  uri = art.get("uri", "")
                  line = phys.get("region", {}).get("startLine", "")
                  loc = f"{uri}:{line}"
                  break
                found.append(f"[{level}] {rule} {loc}")
            if found:
              print(f"::error::Found {len(found)} CodeQL finding(s) at or above '{threshold}'")
              for item in found:
                print(f"  {item}")
              sys.exit(1)
            print(f"No CodeQL findings at or above '{threshold}' threshold.")
          PY
            rc=$?
            if [ "$rc" -ne 0 ]; then failures=1; fi
          done
          echo "::endgroup::"
          exit $failures
